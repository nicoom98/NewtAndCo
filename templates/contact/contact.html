{% extends 'layouts/base.html' %} 
{% load static %}  
{% block title %}Accueil{%endblock %}
{% block banner %}

			<section id="banner">
				<div class="container-fluid">
					<div class="container">
						<div class="row hero-content pt-5 mt-3">
							<h2 class="display-1 p-0 mt-3 mb-0">Contact</h2>
							<nav class="breadcrumb">
								<a
									class="breadcrumb-item nav-link"
									href="#"
									>Home</a
								>
								<a
									class="breadcrumb-item nav-link"
									href="#"
									>Pages</a
								>
								<span
									class="breadcrumb-item active"
									aria-current="page"
									>Contact</span
								>
							</nav>
						</div>
					</div>
					
{% endblock %}
{% block content %}
		<section class="contact-us">
			<div class="container pt-3 px-3">
				<div class="row justify-content-center">
					<div class="inquiry-item col-lg-6">
						<div class="rounded-5">
							<h2 class="text-dark">Contactez-nous</h2>
							<p>
								Vous pouvez nous contacter en utilisant le formulaire
								ci-dessous.
							</p>
							<form
								id="form"
								class="form-group flex-wrap"
								action="https://demo.templatesjungle.com/waggy/contact.php"
								method="post"
							>
								<div class="form-input col-lg-12 d-flex mb-3">
									<input
										type="text"
										name="name"
										placeholder="Nom"
										class="form-control ps-3 me-3"
										required
									/>
									<input
										type="email"
										name="email"
										placeholder="E-mail"
										class="form-control ps-3"
										required
									/>
								</div>
								<div class="col-lg-12 mb-3">
									<input
										type="text"
										name="subject"
										placeholder="Objet"
										class="form-control ps-3"
										required
									/>
								</div>
								<div class="col-lg-12 mb-3">
									<textarea
										name="message"
										placeholder="Message"
										class="form-control ps-3"
										style="height: 150px"
										required
									></textarea>
								</div>
								<div class="d-grid">
									<button
										type="submit"
										class="btn btn-dark btn-lg rounded-1"
									>
										Envoyer
									</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</section>
{% endblock %}
